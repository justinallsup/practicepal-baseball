name: PracticePal quality checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, chore/app-store-readiness]
permissions:
  contents: read
concurrency:
  group: practicepal-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Expo SDK compatibility
        run: npx expo install --check
      - run: npm run build:vercel
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Native bundle compilation (no signing or publishing)
        run: npx expo export --platform ios --platform android --output-dir /tmp/practicepal-native
      - name: Verify native metadata
        run: node scripts/check-native.cjs
